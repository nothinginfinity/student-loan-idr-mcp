name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      publish_deploy_artifact:
        description: "Build and publish a provenance-bearing Wrangler bundle"
        required: false
        type: boolean
        default: false
      deploy_live:
        description: "Deploy the immutable source commit to Cloudflare Workers"
        required: false
        type: boolean
        default: false
      source_ref:
        description: "Immutable commit SHA to bundle; defaults to workflow commit"
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run

  policy-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_deploy_artifact != true && inputs.deploy_live != true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fingerprint official policy sources
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { writeFileSync } = require('node:fs');

          const urls = [
            'https://studentaid.gov/articles/faqs-idr-plan/',
            'https://studentaid.gov/sites/default/files/IncomeDrivenRepayment-en-us.pdf',
            'https://www.govinfo.gov/content/pkg/FR-2026-01-15/pdf/2026-00755.pdf',
            'https://www.govinfo.gov/content/pkg/FR-2026-06-09/pdf/2026-11540.pdf'
          ];

          (async () => {
          const sources = [];
          for (const url of urls) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'user-agent': 'student-loan-idr-mcp-policy-refresh/0.2',
                'accept': '*/*'
              }
            });
            if (!response.ok) throw new Error(`Policy source fetch failed: ${url} -> ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            sources.push({
              url,
              finalUrl: response.url,
              httpStatus: response.status,
              etag: response.headers.get('etag'),
              lastModified: response.headers.get('last-modified'),
              sha256: createHash('sha256').update(bytes).digest('hex')
            });
          }

          writeFileSync(
            'docs/POLICY_SOURCE_SNAPSHOT.json',
            JSON.stringify({ schema: 'student-loan-idr-policy-source-snapshot-v1', sources }, null, 2) + '\n'
          );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Open policy review pull request when source fingerprints change
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/policy-source-refresh
          delete-branch: true
          commit-message: "Review updated student-loan policy source fingerprints"
          title: "Policy source refresh review"
          body: |
            Official policy source fingerprints changed (or the baseline snapshot is being created).

            Review the source changes manually before modifying repayment constants, formulas, eligibility rules, or the policy snapshot date. This automation intentionally never rewrites policy logic itself.
          add-paths: docs/POLICY_SOURCE_SNAPSHOT.json

  deploy-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_deploy_artifact == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: student-loan-idr-deploy-artifact
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build provenance-bearing Wrangler bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          rm -rf .wrangler-deploy-artifact .deploy-publish
          npx wrangler deploy --dry-run --outdir=.wrangler-deploy-artifact
          mapfile -t js_files < <(find .wrangler-deploy-artifact -maxdepth 2 -type f -name '*.js' | sort)
          if [ "${#js_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Wrangler JavaScript bundle, found ${#js_files[@]}" >&2
            printf '%s\n' "${js_files[@]}" >&2
            exit 1
          fi
          mkdir -p .deploy-publish
          cp "${js_files[0]}" .deploy-publish/worker.js
          WORKER_SHA256="$(sha256sum .deploy-publish/worker.js | awk '{print $1}')"
          WRANGLER_VERSION="$(npx wrangler --version | tr -d '\r')"
          export SOURCE_SHA SOURCE_TREE WORKER_SHA256 WRANGLER_VERSION
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, writeFileSync } = require('node:fs');

          const sha256File = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const sourceFiles = readdirSync('src')
            .filter((name) => name.endsWith('.ts'))
            .sort()
            .map((name) => ({ path: `src/${name}`, sha256: sha256File(`src/${name}`) }));

          const manifest = {
            schema: 'student-loan-idr-deploy-artifact-v1',
            source_commit: process.env.SOURCE_SHA,
            source_tree: process.env.SOURCE_TREE,
            worker_sha256: process.env.WORKER_SHA256,
            generated_at: new Date().toISOString(),
            toolchain: {
              node: process.version,
              wrangler: process.env.WRANGLER_VERSION
            },
            inputs: {
              wrangler_jsonc_sha256: sha256File('wrangler.jsonc'),
              package_json_sha256: sha256File('package.json'),
              source_files: sourceFiles
            }
          };
          writeFileSync('.deploy-publish/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "WORKER_SHA256=$WORKER_SHA256" >> "$GITHUB_ENV"
      - name: Publish immutable bundle path to deployment-artifacts branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          worktree="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin deployment-artifacts >/dev/null 2>&1; then
            git fetch origin deployment-artifacts
            git worktree add -B deployment-artifacts "$worktree" origin/deployment-artifacts
          else
            git worktree add --detach "$worktree" HEAD
            (
              cd "$worktree"
              git switch --orphan deployment-artifacts
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          destination="$worktree/bundles/$SOURCE_SHA"
          mkdir -p "$destination"
          cp .deploy-publish/worker.js "$destination/worker.js"
          cp .deploy-publish/manifest.json "$destination/manifest.json"
          (
            cd "$worktree"
            git add "bundles/$SOURCE_SHA/worker.js" "bundles/$SOURCE_SHA/manifest.json"
            if git diff --cached --quiet; then
              echo "Artifact already published for $SOURCE_SHA"
              exit 0
            fi
            git commit -m "Publish deploy artifact $SOURCE_SHA"
            git push origin HEAD:deployment-artifacts
          )

  deploy-live:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_live == true
    runs-on: ubuntu-latest
    concurrency:
      group: student-loan-idr-live-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require an immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.source_ref }}'
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy_live requires source_ref to be a full 40-hex commit SHA." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$requested" ]; then
            echo "Checked-out commit $actual does not match requested immutable source $requested." >&2
            exit 1
          fi
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Require explicit Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret." >&2; exit 1; }
      - name: Apply advisor workspace D1 migrations
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply student-loan-idr-mcp-db --remote
      - name: Set RESEND_API_KEY Worker secret
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${RESEND_API_KEY:-}" ]; then
            printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
          else
            echo "RESEND_API_KEY repository secret not set; skipping (transactional email will be disabled)."
          fi
      - name: Deploy exact tested commit with Wrangler
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx wrangler deploy > wrangler-deploy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            compact="$(tail -n 40 wrangler-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Wrangler deploy failure::$compact"
            whoami_json="$(env -u CLOUDFLARE_ACCOUNT_ID npx wrangler whoami --json 2>/dev/null || true)"
            if [ -n "$whoami_json" ]; then
              accounts="$(printf '%s' "$whoami_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(JSON.stringify(j.accounts ?? []))}catch{process.stdout.write('unparseable')}})")"
              safe_accounts="$(printf '%s' "$accounts" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
              echo "::notice title=Cloudflare token accounts::$safe_accounts"
            fi
            tail -n 40 wrangler-deploy.log
            exit "$status"
          fi
          deployed_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"
          if [ -n "$deployed_url" ]; then
            safe_url="$(printf '%s' "$deployed_url" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=Cloudflare live Worker::$safe_url"
            echo "Live Worker: $deployed_url" >> "$GITHUB_STEP_SUMMARY"
            echo "DEPLOYED_URL=$deployed_url" >> "$GITHUB_ENV"
          fi
          cat wrangler-deploy.log
      - name: Live production MCP acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.DEPLOYED_URL;
          if (!base) throw new Error('DEPLOYED_URL was not captured from Wrangler output.');

          const mcpHeaders = {
            'content-type': 'application/json',
            'accept': 'application/json, text/event-stream'
          };
          let checks = 0;
          const assert = (condition, message) => {
            checks += 1;
            if (!condition) throw new Error(message);
          };
          const fetchChecked = async (url, init = {}) => {
            const response = await fetch(url, { ...init, signal: AbortSignal.timeout(15000) });
            return response;
          };
          const mcp = async (payload, extraHeaders = {}) => fetchChecked(`${base}/mcp`, {
            method: 'POST',
            headers: { ...mcpHeaders, ...extraHeaders },
            body: JSON.stringify(payload)
          });
          const rpcJson = async (payload, extraHeaders = {}) => {
            const response = await mcp(payload, extraHeaders);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`Expected JSON RPC response, got ${response.status}: ${text.slice(0, 300)}`); }
            assert(response.status === 200, `Expected RPC HTTP 200, got ${response.status}: ${text.slice(0, 300)}`);
            return body;
          };

          (async () => {
            let healthResponse;
            let health;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              healthResponse = await fetchChecked(`${base}/health`);
              health = await healthResponse.json();
              if (healthResponse.status === 200 && health?.version === '0.9.6' && health?.advisor_workspace?.max_normalized_client_request_bytes === 524288) break;
              if (attempt < 10) await new Promise((resolve) => setTimeout(resolve, 1500));
            }
            assert(healthResponse.status === 200, `health returned ${healthResponse.status}`);
            assert(health.ok === true && health.name === 'student-loan-idr-mcp', 'health identity mismatch');
            assert(health.version === '0.9.6', `unexpected live version ${health.version}`);
            assert(health.protocol_version === '2025-03-26', 'protocol version mismatch');
            assert(health.policy_snapshot === '2026-08-27', 'policy snapshot mismatch');
            assert(Array.isArray(health.tools) && health.tools.length === 3, 'health tool inventory mismatch');
            assert(health.hardening?.max_request_bytes === 65536, 'request ceiling mismatch');
            assert(health.hardening?.sensitive_payload_logging === false, 'sensitive logging hardening mismatch');
            assert(health.advisor_workspace?.persistence === 'd1', 'advisor D1 binding missing');
            assert(health.advisor_workspace?.authentication === 'server_session_cookie', 'advisor auth mode mismatch');
            assert(health.advisor_workspace?.owner_scoped_client_crud === true, 'advisor owner-scoped CRUD not active');
            assert(health.advisor_workspace?.browser_workspace === '/advisor', 'advisor browser workspace route missing');
            assert(health.advisor_workspace?.saved_guided_client_workflow === true, 'saved guided client workflow flag missing');
            assert(health.advisor_workspace?.repayment_comparison_visualizations === true, 'advisor repayment comparison flag missing');
            assert(health.advisor_workspace?.retained_client_artifacts === true, 'retained client artifact flag missing');
            assert(health.advisor_workspace?.calculation_history === true, 'calculation history flag missing');
            assert(health.advisor_workspace?.student_aid_dual_mode_import === true, 'dual-mode StudentAid import flag missing');
            assert(health.advisor_workspace?.student_aid_normalized_prefill === true, 'StudentAid normalized prefill flag missing');
            assert(health.advisor_workspace?.student_aid_per_loan_facts === true, 'StudentAid per-loan fact flag missing');
            assert(health.advisor_workspace?.fsa_portfolio_intelligence === true, 'FSA portfolio intelligence flag missing');
            assert(health.advisor_workspace?.client_case_context_v1 === true, 'V0.9.4 client case-context capability flag missing');
            assert(health.advisor_workspace?.client_timeline_v1 === true, 'V0.9.5 client timeline capability flag missing');
            assert(health.advisor_workspace?.automatic_case_history === true, 'V0.9.5 automatic case-history flag missing');
            assert(health.advisor_workspace?.advisor_action_dashboard_v1 === true, 'V0.9.6 advisor action-dashboard capability flag missing');
            assert(health.advisor_workspace?.deterministic_next_best_action === true, 'V0.9.6 deterministic next-best-action flag missing');
            assert(Array.isArray(health.endpoints) && health.endpoints.includes('GET /api/advisor/action-dashboard'), 'V0.9.6 action-dashboard endpoint inventory missing');
            assert(health.advisor_workspace?.student_aid_provenance_review === true, 'StudentAid provenance review flag missing');
            assert(health.advisor_workspace?.max_normalized_client_request_bytes === 524288, 'normalized advisor client request ceiling mismatch');
            assert(health.advisor_workspace?.raw_student_aid_retention === false, 'raw StudentAid retention must remain false');

            const livePassword = `Live-v082-${Date.now()}-Strong!`;
            const nonce = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const advisorRequest = async (path, init = {}, auth = null) => {
              const headers = new Headers(init.headers || {});
              headers.set('origin', base);
              if (init.body !== undefined) headers.set('content-type', 'application/json');
              if (auth) {
                headers.set('cookie', auth.cookie);
                if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(init.method || 'GET')) headers.set('x-csrf-token', auth.csrf);
              }
              const response = await fetchChecked(`${base}${path}`, { ...init, headers });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch { throw new Error(`Advisor endpoint ${path} returned non-JSON: ${response.status} ${text.slice(0, 200)}`); }
              return { response, body, text };
            };
            const registerAdvisor = async (label) => {
              const email = `live-v082-${label}-${nonce}@example.test`;
              const result = await advisorRequest('/api/advisor/register', {
                method: 'POST',
                body: JSON.stringify({ email, displayName: `Live Advisor ${label}`, password: livePassword })
              });
              assert(result.response.status === 201 && result.body?.ok === true, `advisor ${label} registration failed: ${result.response.status} ${result.text}`);
              const setCookie = result.response.headers.get('set-cookie') || '';
              assert(setCookie.includes('HttpOnly') && setCookie.includes('Secure') && setCookie.includes('SameSite=Strict'), 'advisor session cookie hardening mismatch');
              return { cookie: setCookie.split(';', 1)[0], csrf: result.body.csrfToken, advisor: result.body.advisor };
            };
            const alpha = await registerAdvisor('alpha');
            const beta = await registerAdvisor('beta');
            assert(alpha.advisor.advisorId !== beta.advisor.advisorId, 'advisor identities must be distinct');

            const createdClient = await advisorRequest('/api/advisor/clients', {
              method: 'POST',
              body: JSON.stringify({ displayName: 'Live Private Borrower', email: 'private-borrower@example.test', phone: '555-0199' })
            }, alpha);
            assert(createdClient.response.status === 201 && createdClient.body?.client?.ownerAdvisorId === alpha.advisor.advisorId, 'advisor client creation/ownership failed');
            const liveClient = createdClient.body.client;

            const alphaList = await advisorRequest('/api/advisor/clients', {}, alpha);
            assert(alphaList.response.status === 200 && alphaList.body?.clients?.length === 1, 'advisor client list failed');
            const listText = JSON.stringify(alphaList.body);
            assert(!listText.includes('private-borrower@example.test') && !listText.includes('555-0199'), 'advisor dashboard list leaked private contact detail');

            const initialActionDashboard = await advisorRequest('/api/advisor/action-dashboard', {}, alpha);
            assert(initialActionDashboard.response.status === 200 && initialActionDashboard.body?.dashboard?.schema === 'student-loan-idr-advisor-action-dashboard-v1', 'V0.9.6 initial advisor action dashboard failed');
            assert(initialActionDashboard.body?.dashboard?.schemaVersion === 1 && initialActionDashboard.body?.dashboard?.clients?.length === 1, 'V0.9.6 initial action-dashboard projection mismatch');
            assert(initialActionDashboard.body.dashboard.clients[0]?.clientId === liveClient.clientId && initialActionDashboard.body.dashboard.clients[0]?.primaryState === 'needs_income', 'V0.9.6 missing-income state derivation failed');
            assert(initialActionDashboard.body.dashboard.clients[0]?.nextBestAction?.kind === 'collect_income', 'V0.9.6 missing-income next-best action failed');
            const initialActionText = JSON.stringify(initialActionDashboard.body);
            assert(!initialActionText.includes('private-borrower@example.test') && !initialActionText.includes('555-0199'), 'V0.9.6 action dashboard leaked private contact detail');
            assert(!/ownerAdvisorId|confirmedFacts|normalizedLoanPortfolio|comparisonSnapshot|shareToken|bookingUrl|basis|result/.test(initialActionText), 'V0.9.6 action dashboard leaked non-minimized case fields');
            const betaActionDashboard = await advisorRequest('/api/advisor/action-dashboard', {}, beta);
            assert(betaActionDashboard.response.status === 200 && betaActionDashboard.body?.dashboard?.clients?.length === 0, 'V0.9.6 action dashboard must remain exact-owner scoped');

            const largeLoans = Array.from({ length: 32 }, (_, loanIndex) => ({
              loanIndex,
              maskedAwardId: `••••${String(loanIndex).padStart(4, '0')}`,
              loanTypeCode: 'D2', loanTypeDescription: 'DIRECT STAFFORD UNSUBSIDIZED', mappedLoanType: 'direct_unsubsidized', disbursementPeriod: 'before_2026_07_01',
              outstandingPrincipal: loanIndex < 6 ? 1000 : 0, outstandingInterest: loanIndex < 6 ? 25 : 0, interestRatePercent: 6.5,
              currentLoanStatusCode: 'RP', currentLoanStatusDescription: 'IN REPAYMENT', repaymentPlanTypeCode: 'IB', repaymentPlanDescription: 'INCOME-BASED REPAYMENT',
              repaymentPlanBeginDate: '01/01/2026', repaymentPlanScheduledAmount: 25, repaymentPlanIdrAnniversaryDate: '05/01/2027', nextPaymentDueDate: '04/15/2026',
              statuses: Array.from({ length: 10 }, (_, statusIndex) => ({ code: statusIndex % 2 === 0 ? 'RP' : 'FB', description: statusIndex % 2 === 0 ? 'IN REPAYMENT' : 'FORBEARANCE', effectiveDate: `${String((statusIndex % 9) + 1).padStart(2, '0')}/01/2025` })),
              disbursements: [{ date: '08/15/2024', amount: 1500 }, { date: '01/15/2025', amount: 1500 }, { date: '08/15/2025', amount: 1500 }],
              contacts: [{ type: 'Current Servicer', name: 'Example Department of Education Servicer', phoneNumber: '8005550101', mostRelevant: true }, { type: 'School', name: 'Example State University', websiteAddress: 'https://example.invalid/school' }],
              provenance: { maskedAwardId: 'derived_studentaid', loanTypeCode: 'imported_studentaid', loanTypeDescription: 'imported_studentaid', mappedLoanType: 'derived_studentaid', disbursementPeriod: 'derived_studentaid', outstandingPrincipal: 'imported_studentaid', outstandingInterest: 'imported_studentaid', interestRatePercent: 'imported_studentaid', currentLoanStatusCode: 'imported_studentaid', currentLoanStatusDescription: 'imported_studentaid', repaymentPlanTypeCode: 'imported_studentaid', repaymentPlanDescription: 'imported_studentaid', repaymentPlanBeginDate: 'imported_studentaid', repaymentPlanScheduledAmount: 'imported_studentaid', repaymentPlanIdrAnniversaryDate: 'imported_studentaid', nextPaymentDueDate: 'imported_studentaid', statuses: 'imported_studentaid', disbursements: 'imported_studentaid', contacts: 'imported_studentaid' }
            }));
            const largeNormalizedPortfolio = {
              repaymentLoans: Array.from({ length: 6 }, () => ({ principal: 1000, annualInterestRatePercent: 6.5 })),
              eligibilityLoans: Array.from({ length: 32 }, () => ({ loanType: 'direct_unsubsidized', disbursementPeriod: 'before_2026_07_01' })),
              loans: largeLoans,
              summary: { loanCount: 32, activeLoanCount: 6, totalOutstandingPrincipal: 6000, totalOutstandingInterest: 150, repaymentLoanCount: 6, eligibilityMappedLoanCount: 32, ambiguousEligibilityLoanCount: 0, hasLoanDisbursedOnOrAfterJuly1_2026: false }
            };
            const largeClientPayload = JSON.stringify({
              contact: { displayName: 'Live Large FSA Borrower', email: 'large-fsa-borrower@example.test', phone: '555-0188' },
              servicerName: 'Example Department of Education Servicer', normalizedLoanPortfolio: largeNormalizedPortfolio,
              studentAidImport: { source: 'studentaid_download', fileRequestDate: '09/05/2026', mappingVersion: '2026-09-05-v2', rawFileRetained: false }
            });
            assert(new TextEncoder().encode(largeClientPayload).byteLength > 65536, 'large live normalized FSA fixture must exceed the legacy 64 KiB limit');
            const largeImportClient = await advisorRequest('/api/advisor/clients', { method: 'POST', body: largeClientPayload }, alpha);
            assert(largeImportClient.response.status === 201 && largeImportClient.body?.client?.normalizedLoanPortfolio?.loans?.length === 32, `large normalized FSA client creation failed: ${largeImportClient.response.status} ${largeImportClient.text}`);
            assert(largeImportClient.body?.client?.studentAidImport?.rawFileRetained === false, 'large normalized FSA client crossed the raw-file retention boundary');
            const deletedLargeImportClient = await advisorRequest(`/api/advisor/clients/${largeImportClient.body.client.clientId}`, { method: 'DELETE', body: JSON.stringify({ confirm: 'delete', expectedUpdatedAt: largeImportClient.body.client.updatedAt }) }, alpha);
            assert(deletedLargeImportClient.response.status === 200, 'large normalized FSA acceptance client cleanup failed');

            const betaRead = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {}, beta);
            assert(betaRead.response.status === 404 && betaRead.body?.error === 'Client not found or not accessible.', 'cross-advisor read must fail generically');
            const betaWrite = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
