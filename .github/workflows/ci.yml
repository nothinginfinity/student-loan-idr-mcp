name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:
    inputs:
      publish_deploy_artifact:
        description: "Build and publish a provenance-bearing Wrangler bundle"
        required: false
        type: boolean
        default: false
      deploy_live:
        description: "Deploy the immutable source commit to Cloudflare Workers"
        required: false
        type: boolean
        default: false
      source_ref:
        description: "Immutable commit SHA to bundle; defaults to workflow commit"
        required: false
        type: string
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir=.wrangler-dry-run

  policy-refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_deploy_artifact != true && inputs.deploy_live != true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fingerprint official policy sources
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { writeFileSync } = require('node:fs');

          const urls = [
            'https://studentaid.gov/articles/faqs-idr-plan/',
            'https://studentaid.gov/sites/default/files/IncomeDrivenRepayment-en-us.pdf',
            'https://www.govinfo.gov/content/pkg/FR-2026-01-15/pdf/2026-00755.pdf',
            'https://www.govinfo.gov/content/pkg/FR-2026-06-09/pdf/2026-11540.pdf'
          ];

          (async () => {
          const sources = [];
          for (const url of urls) {
            const response = await fetch(url, {
              redirect: 'follow',
              headers: {
                'user-agent': 'student-loan-idr-mcp-policy-refresh/0.2',
                'accept': '*/*'
              }
            });
            if (!response.ok) throw new Error(`Policy source fetch failed: ${url} -> ${response.status}`);
            const bytes = Buffer.from(await response.arrayBuffer());
            sources.push({
              url,
              finalUrl: response.url,
              httpStatus: response.status,
              etag: response.headers.get('etag'),
              lastModified: response.headers.get('last-modified'),
              sha256: createHash('sha256').update(bytes).digest('hex')
            });
          }

          writeFileSync(
            'docs/POLICY_SOURCE_SNAPSHOT.json',
            JSON.stringify({ schema: 'student-loan-idr-policy-source-snapshot-v1', sources }, null, 2) + '\n'
          );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Open policy review pull request when source fingerprints change
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/policy-source-refresh
          delete-branch: true
          commit-message: "Review updated student-loan policy source fingerprints"
          title: "Policy source refresh review"
          body: |
            Official policy source fingerprints changed (or the baseline snapshot is being created).

            Review the source changes manually before modifying repayment constants, formulas, eligibility rules, or the policy snapshot date. This automation intentionally never rewrites policy logic itself.
          add-paths: docs/POLICY_SOURCE_SNAPSHOT.json

  deploy-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_deploy_artifact == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: student-loan-idr-deploy-artifact
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref != '' && inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Build provenance-bearing Wrangler bundle
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          rm -rf .wrangler-deploy-artifact .deploy-publish
          npx wrangler deploy --dry-run --outdir=.wrangler-deploy-artifact
          mapfile -t js_files < <(find .wrangler-deploy-artifact -maxdepth 2 -type f -name '*.js' | sort)
          if [ "${#js_files[@]}" -ne 1 ]; then
            echo "Expected exactly one Wrangler JavaScript bundle, found ${#js_files[@]}" >&2
            printf '%s\n' "${js_files[@]}" >&2
            exit 1
          fi
          mkdir -p .deploy-publish
          cp "${js_files[0]}" .deploy-publish/worker.js
          WORKER_SHA256="$(sha256sum .deploy-publish/worker.js | awk '{print $1}')"
          WRANGLER_VERSION="$(npx wrangler --version | tr -d '\r')"
          export SOURCE_SHA SOURCE_TREE WORKER_SHA256 WRANGLER_VERSION
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, writeFileSync } = require('node:fs');

          const sha256File = (path) => createHash('sha256').update(readFileSync(path)).digest('hex');
          const sourceFiles = readdirSync('src')
            .filter((name) => name.endsWith('.ts'))
            .sort()
            .map((name) => ({ path: `src/${name}`, sha256: sha256File(`src/${name}`) }));

          const manifest = {
            schema: 'student-loan-idr-deploy-artifact-v1',
            source_commit: process.env.SOURCE_SHA,
            source_tree: process.env.SOURCE_TREE,
            worker_sha256: process.env.WORKER_SHA256,
            generated_at: new Date().toISOString(),
            toolchain: {
              node: process.version,
              wrangler: process.env.WRANGLER_VERSION
            },
            inputs: {
              wrangler_jsonc_sha256: sha256File('wrangler.jsonc'),
              package_json_sha256: sha256File('package.json'),
              source_files: sourceFiles
            }
          };
          writeFileSync('.deploy-publish/manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          NODE
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "WORKER_SHA256=$WORKER_SHA256" >> "$GITHUB_ENV"
      - name: Publish immutable bundle path to deployment-artifacts branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          worktree="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin deployment-artifacts >/dev/null 2>&1; then
            git fetch origin deployment-artifacts
            git worktree add -B deployment-artifacts "$worktree" origin/deployment-artifacts
          else
            git worktree add --detach "$worktree" HEAD
            (
              cd "$worktree"
              git switch --orphan deployment-artifacts
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi
          destination="$worktree/bundles/$SOURCE_SHA"
          mkdir -p "$destination"
          cp .deploy-publish/worker.js "$destination/worker.js"
          cp .deploy-publish/manifest.json "$destination/manifest.json"
          (
            cd "$worktree"
            git add "bundles/$SOURCE_SHA/worker.js" "bundles/$SOURCE_SHA/manifest.json"
            if git diff --cached --quiet; then
              echo "Artifact already published for $SOURCE_SHA"
              exit 0
            fi
            git commit -m "Publish deploy artifact $SOURCE_SHA"
            git push origin HEAD:deployment-artifacts
          )

  deploy-live:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_live == true
    runs-on: ubuntu-latest
    concurrency:
      group: student-loan-idr-live-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require an immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.source_ref }}'
          if [[ ! "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            echo "deploy_live requires source_ref to be a full 40-hex commit SHA." >&2
            exit 1
          fi
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$requested" ]; then
            echo "Checked-out commit $actual does not match requested immutable source $requested." >&2
            exit 1
          fi
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Require explicit Cloudflare deployment credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret." >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret." >&2; exit 1; }
      - name: Apply advisor workspace D1 migrations
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 migrations apply student-loan-idr-mcp-db --remote
      - name: Deploy exact tested commit with Wrangler
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          npx wrangler deploy > wrangler-deploy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            compact="$(tail -n 40 wrangler-deploy.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error title=Wrangler deploy failure::$compact"
            whoami_json="$(env -u CLOUDFLARE_ACCOUNT_ID npx wrangler whoami --json 2>/dev/null || true)"
            if [ -n "$whoami_json" ]; then
              accounts="$(printf '%s' "$whoami_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);process.stdout.write(JSON.stringify(j.accounts ?? []))}catch{process.stdout.write('unparseable')}})")"
              safe_accounts="$(printf '%s' "$accounts" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
              echo "::notice title=Cloudflare token accounts::$safe_accounts"
            fi
            tail -n 40 wrangler-deploy.log
            exit "$status"
          fi
          deployed_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' wrangler-deploy.log | tail -n 1 || true)"
          if [ -n "$deployed_url" ]; then
            safe_url="$(printf '%s' "$deployed_url" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::notice title=Cloudflare live Worker::$safe_url"
            echo "Live Worker: $deployed_url" >> "$GITHUB_STEP_SUMMARY"
            echo "DEPLOYED_URL=$deployed_url" >> "$GITHUB_ENV"
          fi
          cat wrangler-deploy.log
      - name: Live production MCP acceptance
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.DEPLOYED_URL;
          if (!base) throw new Error('DEPLOYED_URL was not captured from Wrangler output.');

          const mcpHeaders = {
            'content-type': 'application/json',
            'accept': 'application/json, text/event-stream'
          };
          let checks = 0;
          const assert = (condition, message) => {
            checks += 1;
            if (!condition) throw new Error(message);
          };
          const fetchChecked = async (url, init = {}) => {
            const response = await fetch(url, { ...init, signal: AbortSignal.timeout(15000) });
            return response;
          };
          const mcp = async (payload, extraHeaders = {}) => fetchChecked(`${base}/mcp`, {
            method: 'POST',
            headers: { ...mcpHeaders, ...extraHeaders },
            body: JSON.stringify(payload)
          });
          const rpcJson = async (payload, extraHeaders = {}) => {
            const response = await mcp(payload, extraHeaders);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`Expected JSON RPC response, got ${response.status}: ${text.slice(0, 300)}`); }
            assert(response.status === 200, `Expected RPC HTTP 200, got ${response.status}: ${text.slice(0, 300)}`);
            return body;
          };

          (async () => {
            let healthResponse;
            let health;
            for (let attempt = 1; attempt <= 10; attempt += 1) {
              healthResponse = await fetchChecked(`${base}/health`);
              health = await healthResponse.json();
              if (healthResponse.status === 200 && health?.version === '0.8.5') break;
              if (attempt < 10) await new Promise((resolve) => setTimeout(resolve, 1500));
            }
            assert(healthResponse.status === 200, `health returned ${healthResponse.status}`);
            assert(health.ok === true && health.name === 'student-loan-idr-mcp', 'health identity mismatch');
            assert(health.version === '0.8.5', `unexpected live version ${health.version}`);
            assert(health.protocol_version === '2025-03-26', 'protocol version mismatch');
            assert(health.policy_snapshot === '2026-08-27', 'policy snapshot mismatch');
            assert(Array.isArray(health.tools) && health.tools.length === 3, 'health tool inventory mismatch');
            assert(health.hardening?.max_request_bytes === 65536, 'request ceiling mismatch');
            assert(health.hardening?.sensitive_payload_logging === false, 'sensitive logging hardening mismatch');
            assert(health.advisor_workspace?.persistence === 'd1', 'advisor D1 binding missing');
            assert(health.advisor_workspace?.authentication === 'server_session_cookie', 'advisor auth mode mismatch');
            assert(health.advisor_workspace?.owner_scoped_client_crud === true, 'advisor owner-scoped CRUD not active');
            assert(health.advisor_workspace?.browser_workspace === '/advisor', 'advisor browser workspace route missing');
            assert(health.advisor_workspace?.saved_guided_client_workflow === true, 'saved guided client workflow flag missing');
            assert(health.advisor_workspace?.repayment_comparison_visualizations === true, 'advisor repayment comparison flag missing');
            assert(health.advisor_workspace?.retained_client_artifacts === true, 'retained client artifact flag missing');
            assert(health.advisor_workspace?.calculation_history === true, 'calculation history flag missing');
            assert(health.advisor_workspace?.raw_student_aid_retention === false, 'raw StudentAid retention must remain false');

            const livePassword = `Live-v082-${Date.now()}-Strong!`;
            const nonce = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            const advisorRequest = async (path, init = {}, auth = null) => {
              const headers = new Headers(init.headers || {});
              headers.set('origin', base);
              if (init.body !== undefined) headers.set('content-type', 'application/json');
              if (auth) {
                headers.set('cookie', auth.cookie);
                if (['POST', 'PUT', 'PATCH', 'DELETE'].includes(init.method || 'GET')) headers.set('x-csrf-token', auth.csrf);
              }
              const response = await fetchChecked(`${base}${path}`, { ...init, headers });
              const text = await response.text();
              let body = null;
              try { body = text ? JSON.parse(text) : null; } catch { throw new Error(`Advisor endpoint ${path} returned non-JSON: ${response.status} ${text.slice(0, 200)}`); }
              return { response, body, text };
            };
            const registerAdvisor = async (label) => {
              const email = `live-v082-${label}-${nonce}@example.test`;
              const result = await advisorRequest('/api/advisor/register', {
                method: 'POST',
                body: JSON.stringify({ email, displayName: `Live Advisor ${label}`, password: livePassword })
              });
              assert(result.response.status === 201 && result.body?.ok === true, `advisor ${label} registration failed: ${result.response.status} ${result.text}`);
              const setCookie = result.response.headers.get('set-cookie') || '';
              assert(setCookie.includes('HttpOnly') && setCookie.includes('Secure') && setCookie.includes('SameSite=Strict'), 'advisor session cookie hardening mismatch');
              return { cookie: setCookie.split(';', 1)[0], csrf: result.body.csrfToken, advisor: result.body.advisor };
            };
            const alpha = await registerAdvisor('alpha');
            const beta = await registerAdvisor('beta');
            assert(alpha.advisor.advisorId !== beta.advisor.advisorId, 'advisor identities must be distinct');

            const createdClient = await advisorRequest('/api/advisor/clients', {
              method: 'POST',
              body: JSON.stringify({ displayName: 'Live Private Borrower', email: 'private-borrower@example.test', phone: '555-0199' })
            }, alpha);
            assert(createdClient.response.status === 201 && createdClient.body?.client?.ownerAdvisorId === alpha.advisor.advisorId, 'advisor client creation/ownership failed');
            const liveClient = createdClient.body.client;

            const alphaList = await advisorRequest('/api/advisor/clients', {}, alpha);
            assert(alphaList.response.status === 200 && alphaList.body?.clients?.length === 1, 'advisor client list failed');
            const listText = JSON.stringify(alphaList.body);
            assert(!listText.includes('private-borrower@example.test') && !listText.includes('555-0199'), 'advisor dashboard list leaked private contact detail');

            const betaRead = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {}, beta);
            assert(betaRead.response.status === 404 && betaRead.body?.error === 'Client not found or not accessible.', 'cross-advisor read must fail generically');
            const betaWrite = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
              method: 'PUT', body: JSON.stringify({ expectedUpdatedAt: liveClient.updatedAt, notes: 'cross-owner write' })
            }, beta);
            assert(betaWrite.response.status === 404 && betaWrite.body?.error === 'Client not found or not accessible.', 'cross-advisor write must fail generically');

            const rawRetention = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
              method: 'PUT', body: JSON.stringify({ expectedUpdatedAt: liveClient.updatedAt, studentAidImport: { source: 'studentaid_download', rawFileRetained: true } })
            }, alpha);
            assert(rawRetention.response.status === 400, 'raw StudentAid retention must be rejected');

            const updatedClient = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
              method: 'PUT', body: JSON.stringify({
                expectedUpdatedAt: liveClient.updatedAt,
                readinessState: 'application_ready',
                servicerName: 'Example Servicer',
                notes: 'live acceptance note',
                confirmedFacts: {
                  income: [{ cadence: 'biweekly', amount: 1200 }],
                  incomeSources: [{ sourceType: 'employment', name: 'Example Employer', grossAmount: 1200, paymentFrequency: 'biweekly', evidenceState: 'evidence_in_hand' }],
                  region: 'contiguous_us', familySize: 2, dependentsClaimedOnFederalTaxReturn: 1, newBorrowerOnOrAfterJuly1_2014: true
                },
                normalizedLoanPortfolio: {
                  repaymentLoans: [{ principal: 25000, annualInterestRatePercent: 6.5 }],
                  eligibilityLoans: [{ loanType: 'direct_unsubsidized', disbursementPeriod: 'before_2026_07_01' }]
                },
                studentAidImport: { source: 'studentaid_download', importedAt: new Date().toISOString(), rawFileRetained: false }
              })
            }, alpha);
            assert(updatedClient.response.status === 200 && updatedClient.body?.client?.readinessState === 'application_ready', 'advisor client saved-workflow update failed');
            assert(updatedClient.body?.client?.confirmedFacts?.familySize === 2, 'advisor saved family-size fact missing');
            assert(updatedClient.body?.client?.confirmedFacts?.incomeSources?.[0]?.name === 'Example Employer', 'advisor saved income source missing');
            assert(updatedClient.body?.client?.normalizedLoanPortfolio?.repaymentLoans?.[0]?.principal === 25000, 'advisor saved normalized loan portfolio missing');
            assert(updatedClient.body?.client?.studentAidImport?.rawFileRetained === false, 'normalized StudentAid metadata boundary mismatch');

            const resumedClient = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {}, alpha);
            assert(resumedClient.response.status === 200, 'advisor saved client resume read failed');
            assert(resumedClient.body?.client?.servicerName === 'Example Servicer', 'advisor resumed servicer fact missing');
            assert(resumedClient.body?.client?.confirmedFacts?.dependentsClaimedOnFederalTaxReturn === 1, 'advisor resumed application fact missing');

            const comparison = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/comparison`, {}, alpha);
            assert(comparison.response.status === 200 && comparison.body?.ok === true, 'advisor comparison endpoint failed');
            assert(comparison.body?.comparison?.schema === 'student-loan-idr-advisor-comparison-v1', 'advisor comparison schema mismatch');
            assert(comparison.body?.comparison?.projections?.length === 4, 'advisor comparison plan inventory mismatch');
            const rapProjection = comparison.body.comparison.projections.find((plan) => plan.plan === 'RAP');
            const ibrProjection = comparison.body.comparison.projections.find((plan) => plan.plan === 'IBR');
            const payeProjection = comparison.body.comparison.projections.find((plan) => plan.plan === 'PAYE');
            const icrProjection = comparison.body.comparison.projections.find((plan) => plan.plan === 'ICR');
            assert(rapProjection?.projectionKind === 'forgiveness_horizon' && rapProjection?.horizonMonths === 360, 'RAP 30-year comparison horizon mismatch');
            assert(rapProjection?.projectedInterestWaived > 0, 'RAP comparison did not model unpaid-interest waiver');
            assert(rapProjection?.projectedPrincipalMatch > 0, 'RAP comparison did not model principal match');
            assert(rapProjection?.projectedForgiveness >= 0, 'RAP forgiveness estimate missing');
            assert(ibrProjection?.projectionKind === 'forgiveness_horizon' && ibrProjection?.horizonMonths === 240, 'IBR saved 20-year horizon mismatch');
            assert(ibrProjection?.projectedForgiveness > 0, 'IBR forgiveness estimate missing for low-income fixture');
            assert(payeProjection?.projectionKind === 'sunset_only' && payeProjection?.horizonMonths === 22, 'PAYE sunset-bounded projection mismatch');
            assert(icrProjection?.projectionKind === 'sunset_only' && icrProjection?.horizonMonths === 22, 'ICR sunset-bounded projection mismatch');
            assert(payeProjection?.projectedForgiveness === null, 'PAYE must not invent post-sunset forgiveness');
            assert(icrProjection?.projectedForgiveness === null, 'ICR must not invent post-sunset forgiveness');
            const betaComparison = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/comparison`, {}, beta);
            assert(betaComparison.response.status === 404 && betaComparison.body?.error === 'Client not found or not accessible.', 'cross-advisor comparison must fail generically');

            const retainedArtifact = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/artifacts`, {
              method: 'POST', body: JSON.stringify({
                name: 'Live retained income draft',
                templateRequest: { templateType: 'current_income_statement', outputFormat: 'text', borrowerName: 'Live Private Borrower', servicerName: 'Example Servicer', incomeSources: [{ sourceType: 'employment', name: 'Example Employer', grossAmount: 1200, paymentFrequency: 'biweekly' }] }
              })
            }, alpha);
            assert(retainedArtifact.response.status === 201 && retainedArtifact.body?.artifact?.artifactKind === 'document_draft', 'retained document artifact creation failed');
            assert(retainedArtifact.body?.artifact?.documentText?.includes('Live Private Borrower'), 'retained document artifact lost borrower fact');
            const retainedArtifactId = retainedArtifact.body.artifact.artifactId;
            const artifactList = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/artifacts`, {}, alpha);
            assert(artifactList.response.status === 200 && artifactList.body?.artifacts?.length === 1, 'retained artifact list failed');
            assert(!JSON.stringify(artifactList.body).includes('Example Employer'), 'retained artifact list leaked document payload');
            const betaArtifact = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/artifacts/${retainedArtifactId}`, {}, beta);
            assert(betaArtifact.response.status === 404 && betaArtifact.body?.error === 'Client not found or not accessible.', 'cross-advisor retained artifact read must fail generically');
            const regeneratedArtifact = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/artifacts/${retainedArtifactId}/regenerate`, { method: 'POST', body: '{}' }, alpha);
            assert(regeneratedArtifact.response.status === 200 && regeneratedArtifact.body?.regenerated?.documentText?.includes('Example Employer'), 'retained artifact regeneration failed');

            const retainedComparison = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots`, { method: 'POST', body: JSON.stringify({ name: 'Live forgiveness comparison', snapshotKind: 'comparison' }) }, alpha);
            assert(retainedComparison.response.status === 201 && retainedComparison.body?.snapshot?.result?.projections?.length === 4, 'retained comparison snapshot failed');
            const retainedSnapshotId = retainedComparison.body.snapshot.snapshotId;
            const retainedCalculation = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots`, { method: 'POST', body: JSON.stringify({ name: 'Live repayment calculation', snapshotKind: 'calculation' }) }, alpha);
            assert(retainedCalculation.response.status === 201 && retainedCalculation.body?.snapshot?.result?.planEstimates?.length === 4, 'retained calculation snapshot failed');
            const snapshotList = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots`, {}, alpha);
            assert(snapshotList.response.status === 200 && snapshotList.body?.snapshots?.length === 2, 'retained snapshot list failed');
            assert(!JSON.stringify(snapshotList.body).includes('25000'), 'retained snapshot list leaked calculation basis/result payload');
            const rerunSnapshot = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots/${retainedSnapshotId}/rerun`, { method: 'POST', body: '{}' }, alpha);
            assert(rerunSnapshot.response.status === 200 && rerunSnapshot.body?.rerun?.basis === 'retained_snapshot_basis', 'retained snapshot rerun failed');
            const betaSnapshot = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots/${retainedSnapshotId}`, {}, beta);
            assert(betaSnapshot.response.status === 404 && betaSnapshot.body?.error === 'Client not found or not accessible.', 'cross-advisor retained snapshot read must fail generically');

            const exportedClient = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/export`, {}, alpha);
            assert(exportedClient.response.status === 200 && exportedClient.body?.schema === 'student-loan-idr-advisor-client-export-v2', 'advisor client export failed');
            assert(exportedClient.body?.retainedArtifacts?.length === 1 && exportedClient.body?.calculationSnapshots?.length === 2, 'advisor client export omitted retained history');

            const deletedArtifact = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/artifacts/${retainedArtifactId}`, { method: 'DELETE', body: '{}' }, alpha);
            assert(deletedArtifact.response.status === 200, 'retained artifact deletion failed');
            const deletedSnapshot = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/snapshots/${retainedSnapshotId}`, { method: 'DELETE', body: '{}' }, alpha);
            assert(deletedSnapshot.response.status === 200, 'retained snapshot deletion failed');

            const archivedClient = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}/archive`, {
              method: 'POST', body: JSON.stringify({ expectedUpdatedAt: updatedClient.body.client.updatedAt })
            }, alpha);
            assert(archivedClient.response.status === 200 && archivedClient.body?.client?.lifecycleState === 'archived', 'advisor client archive failed');

            const badCsrf = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
              method: 'DELETE', headers: { 'x-csrf-token': 'wrong-token' }, body: JSON.stringify({ confirm: 'delete', expectedUpdatedAt: archivedClient.body.client.updatedAt })
            }, { ...alpha, csrf: 'wrong-token' });
            assert(badCsrf.response.status === 403, 'advisor mutation with bad CSRF must fail');

            const deletedClient = await advisorRequest(`/api/advisor/clients/${liveClient.clientId}`, {
              method: 'DELETE', body: JSON.stringify({ confirm: 'delete', expectedUpdatedAt: archivedClient.body.client.updatedAt })
            }, alpha);
            assert(deletedClient.response.status === 200, 'advisor client deletion failed');

            for (const auth of [alpha, beta]) {
              const deletedAccount = await advisorRequest('/api/advisor/account', { method: 'DELETE', body: JSON.stringify({ password: livePassword }) }, auth);
              assert(deletedAccount.response.status === 200, `advisor acceptance account cleanup failed: ${deletedAccount.response.status} ${deletedAccount.text}`);
            }

            const advisorUiResponse = await fetchChecked(`${base}/advisor`);
            const advisorUiHtml = await advisorUiResponse.text();
            assert(advisorUiResponse.status === 200, `advisor UI returned ${advisorUiResponse.status}`);
            assert((advisorUiResponse.headers.get('content-type') || '').includes('text/html'), 'advisor UI content type mismatch');
            assert((advisorUiResponse.headers.get('content-security-policy') || '').includes("default-src 'none'"), 'advisor UI CSP missing default-src none');
            assert(advisorUiHtml.includes('id="login-form"') && advisorUiHtml.includes('id="register-form"'), 'advisor auth forms missing');
            assert(advisorUiHtml.includes('id="create-client-form"'), 'advisor create-client form missing');
            assert(advisorUiHtml.includes('id="client-list"'), 'advisor client dashboard missing');
            assert(advisorUiHtml.includes('Open guided workflow'), 'advisor guided-client action missing');
            assert(/raw StudentAid\.gov downloads/i.test(advisorUiHtml), 'advisor raw-file privacy boundary missing');
            assert(!advisorUiHtml.includes('localStorage') && !advisorUiHtml.includes('sessionStorage'), 'advisor UI must not create browser persistence');

            const uiResponse = await fetchChecked(`${base}/?advisorClient=client_00000000-0000-0000-0000-000000000000`);
            const uiHtml = await uiResponse.text();
            assert(uiResponse.status === 200, `UI returned ${uiResponse.status}`);
            assert((uiResponse.headers.get('content-type') || '').includes('text/html'), 'UI content type mismatch');
            assert((uiResponse.headers.get('content-security-policy') || '').includes("default-src 'none'"), 'UI CSP missing default-src none');
            assert(uiHtml.includes('id="calculator-form"'), 'UI calculator form missing');
            assert(uiHtml.includes('id="advisor-client-bar"'), 'saved advisor-client workflow bar missing');
            assert(uiHtml.includes('id="advisor-save-progress"'), 'saved advisor-client progress control missing');
            assert(uiHtml.includes('id="advisor-regenerate-document"'), 'advisor document-regeneration control missing');
            assert(uiHtml.includes('id="advisor-compare-plans"'), 'advisor repayment-comparison control missing');
            assert(uiHtml.includes('id="advisor-comparison-workspace"'), 'advisor comparison workspace missing');
            assert(uiHtml.includes('id="advisor-history-workspace"'), 'advisor retained-history workspace missing');
            assert(uiHtml.includes('id="advisor-retain-document"') && uiHtml.includes('id="advisor-retain-calculation"') && uiHtml.includes('id="advisor-retain-comparison"'), 'advisor explicit retention controls missing');
            assert(uiHtml.includes('Rerun retained basis') && uiHtml.includes('Raw StudentAid downloads and evidence files are never retained.'), 'advisor retained-history privacy/rerun controls missing');
            assert(uiHtml.includes('id="advisor-payment-chart"') && uiHtml.includes('id="advisor-paid-chart"') && uiHtml.includes('id="advisor-balance-chart"') && uiHtml.includes('id="advisor-forgiveness-chart"'), 'advisor comparison chart surfaces missing');
            assert(uiHtml.includes('Modeled estimate'), 'advisor comparison non-guarantee label missing');
            assert(uiHtml.includes('saveAdvisorClientProgress'), 'advisor normalized save workflow missing');
            assert(uiHtml.includes('id="guided-assistant"'), 'UI guided assistant missing');
            assert(uiHtml.includes('id="guide-answers"'), 'UI guided answer bubbles missing');
            assert(uiHtml.includes('id="guide-input"'), 'UI guided typed-answer input missing');
            assert(uiHtml.includes('Facts collected in this session'), 'UI guided fact ledger missing');
            assert(uiHtml.includes('No account is required'), 'UI private no-account guided boundary missing');
            assert(uiHtml.includes('Could my IBR payment be $0?'), 'UI IBR zero-payment quick-info bubble missing');
            assert(uiHtml.includes('Prepare stated income document'), 'UI stated-income follow-up action missing');
            assert(uiHtml.includes('Prepare unemployment statement'), 'UI unemployment follow-up action missing');
            assert(uiHtml.includes('id="document-workspace"'), 'UI document review workspace missing');
            assert(uiHtml.includes('id="income-readiness-panel"'), 'UI source-by-source readiness panel missing');
            assert(uiHtml.includes('id="document-scope"'), 'UI source-specific draft selector missing');
            assert(uiHtml.includes('Source-by-source income readiness'), 'UI source readiness guidance missing');
            assert(uiHtml.includes('Application-ready') && uiHtml.includes('Document-ready'), 'UI readiness states missing');
            assert(uiHtml.includes('Evidence in hand (borrower-stated)'), 'UI borrower-stated evidence boundary missing');
            assert(uiHtml.includes('guidedCalculatorIncome'), 'UI multi-source calculator handoff missing');
            assert(uiHtml.includes('id="document-reviewed"'), 'UI document review acknowledgement missing');
            assert(uiHtml.includes('Print / Save PDF'), 'UI document print action missing');
            assert(uiHtml.includes('Download HTML'), 'UI document download action missing');
            assert(uiHtml.includes('/api/document'), 'UI document API integration missing');
            assert(uiHtml.includes('must sign it myself'), 'UI review-before-sign boundary missing');
            assert(uiHtml.includes('id="loan-file"'), 'UI local loan-file import missing');
            assert(uiHtml.includes('Download My Aid Data'), 'UI StudentAid import guidance missing');
            assert(/raw file is never uploaded/i.test(uiHtml), 'UI raw-file privacy boundary missing');
            assert(/no six-person cap/i.test(uiHtml), 'UI family-size correction missing');
            assert(uiHtml.includes('Documented fact') && uiHtml.includes('Imported fact') && uiHtml.includes('Derived estimate'), 'UI fact provenance labels missing');
            assert(!uiHtml.includes('/api/import'), 'UI must not upload raw loan files to an import API');

            const quickInfo = await fetchChecked(`${base}/api/ibr-zero-payment?region=contiguous_us`);
            const quickInfoBody = await quickInfo.json();
            assert(quickInfo.status === 200, `IBR quick info returned ${quickInfo.status}`);
            assert(quickInfoBody?.thresholds?.length === 6, 'IBR quick info family-size table mismatch');
            assert(quickInfoBody.thresholds[5]?.maxAgiForZeroPayment === 66540, 'IBR family-size-6 $0 cutoff mismatch');
            assert(quickInfoBody.thresholds[0]?.maxAgiForZeroPayment === 23940, 'IBR family-size-1 $0 cutoff mismatch');

            const rawImportEndpoint = await fetchChecked(`${base}/api/import`);
            assert(rawImportEndpoint.status === 404, `raw import endpoint must not exist, got ${rawImportEndpoint.status}`);

            const browserDocument = await fetchChecked(`${base}/api/document`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                templateType: 'current_income_statement',
                outputFormat: 'text',
                borrowerName: 'Live Browser Draft',
                servicerName: 'Example Servicer',
                incomeSources: [
                  { sourceType: 'employment', name: 'Example Employer', grossAmount: 1200, paymentFrequency: 'biweekly' },
                  { sourceType: 'contract', name: 'Example Side Client', grossAmount: 300, paymentFrequency: 'monthly' }
                ]
              })
            });
            const browserDocumentBody = await browserDocument.json();
            assert(browserDocument.status === 200, `browser document returned ${browserDocument.status}`);
            assert(browserDocumentBody?.ok === true, 'browser document response not ok');
            assert(browserDocumentBody.document.includes('Live Browser Draft'), 'browser document lost borrower fact');
            assert(browserDocumentBody.document.includes('Example Employer'), 'browser document lost first payer fact');
            assert(browserDocumentBody.document.includes('Example Side Client'), 'browser document lost second payer fact');
            assert(browserDocumentBody.document.includes('Income source 2'), 'browser document did not preserve source separation');
            assert(browserDocumentBody.document.includes('Supporting evidence checklist'), 'browser document missing evidence checklist');
            assert(browserDocument.headers.get('cache-control') === 'no-store', 'browser document cache policy mismatch');

            const browserDocumentHtml = await fetchChecked(`${base}/api/document`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                templateType: 'current_income_statement', outputFormat: 'html', borrowerName: '<script>unsafe</script>'
              })
            });
            const browserDocumentHtmlBody = await browserDocumentHtml.json();
            assert(browserDocumentHtml.status === 200, `browser HTML document returned ${browserDocumentHtml.status}`);
            assert(browserDocumentHtmlBody.document.startsWith('<!doctype html>'), 'browser HTML document format mismatch');
            assert(browserDocumentHtmlBody.document.includes('&lt;script&gt;unsafe&lt;/script&gt;'), 'browser HTML document did not escape caller markup');
            assert(!browserDocumentHtmlBody.document.includes('<script>unsafe</script>'), 'browser HTML document contains unescaped caller markup');

            const browserDocumentForbidden = await fetchChecked(`${base}/api/document`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', origin: 'https://evil.example' },
              body: '{}'
            });
            assert(browserDocumentForbidden.status === 403, `browser document cross-origin request expected 403, got ${browserDocumentForbidden.status}`);

            const uiCalculator = await fetchChecked(`${base}/api/calculate`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                income: [{ cadence: 'annual', amount: 50000 }],
                region: 'contiguous_us', familySize: 2,
                dependentsClaimedOnFederalTaxReturn: 1, plans: ['RAP']
              })
            });
            const uiCalculatorBody = await uiCalculator.json();
            assert(uiCalculator.status === 200, `UI calculator returned ${uiCalculator.status}`);
            assert(uiCalculatorBody?.result?.planEstimates?.[0]?.monthlyPaymentEstimate === 116.67, 'UI calculator fixture mismatch');

            const uiForbiddenOrigin = await fetchChecked(`${base}/api/calculate`, {
              method: 'POST',
              headers: { 'content-type': 'application/json', origin: 'https://evil.example' },
              body: '{}'
            });
            assert(uiForbiddenOrigin.status === 403, `UI cross-origin request expected 403, got ${uiForbiddenOrigin.status}`);

            const uiOversized = await fetchChecked(`${base}/api/calculate`, {
              method: 'POST', headers: { 'content-type': 'application/json' }, body: 'x'.repeat(70 * 1024)
            });
            assert(uiOversized.status === 413, `UI oversized request expected 413, got ${uiOversized.status}`);

            const getMcp = await fetchChecked(`${base}/mcp`, { headers: { accept: 'text/event-stream' } });
            const getMcpText = await getMcp.text();
            assert(getMcp.status === 405, `GET /mcp expected 405, got ${getMcp.status}`);
            assert(getMcp.headers.get('allow') === 'POST, OPTIONS', 'GET /mcp Allow header mismatch');
            assert(/SSE listening is not implemented/i.test(getMcpText), 'GET /mcp missing explicit SSE message');

            const initialize = await rpcJson({
              jsonrpc: '2.0', id: 1, method: 'initialize', params: {
                protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'live-acceptance', version: '1.0.0' }
              }
            });
            assert(initialize.result?.protocolVersion === '2025-03-26', 'initialize protocol negotiation mismatch');
            assert(initialize.result?.serverInfo?.version === '0.8.5', 'initialize server version mismatch');

            const tools = await rpcJson({ jsonrpc: '2.0', id: 2, method: 'tools/list' });
            const toolNames = (tools.result?.tools ?? []).map((tool) => tool.name).sort();
            assert(JSON.stringify(toolNames) === JSON.stringify([
              'calculate_alt_income_student_loan',
              'get_repayment_documentation_template',
              'policy_status'
            ].sort()), `tools/list mismatch: ${JSON.stringify(toolNames)}`);

            const policy = await rpcJson({
              jsonrpc: '2.0', id: 3, method: 'tools/call', params: { name: 'policy_status', arguments: {} }
            });
            assert(policy.result?.structuredContent?.policySnapshot === '2026-08-27', 'policy_status snapshot mismatch');
            assert(policy.result?.structuredContent?.icrFactorTable?.effectiveFrom === '2026-07-01', 'policy_status ICR effective date mismatch');

            const calculator = await rpcJson({
              jsonrpc: '2.0', id: 4, method: 'tools/call', params: {
                name: 'calculate_alt_income_student_loan',
                arguments: {
                  income: [{ cadence: 'annual', amount: 50000 }],
                  region: 'contiguous_us',
                  familySize: 2,
                  dependentsClaimedOnFederalTaxReturn: 1,
                  plans: ['RAP']
                }
              }
            });
            assert(calculator.result?.structuredContent?.planEstimates?.[0]?.monthlyPaymentEstimate === 116.67,
              `calculator live fixture mismatch: ${JSON.stringify(calculator.result?.structuredContent?.planEstimates?.[0])}`);

            const document = await rpcJson({
              jsonrpc: '2.0', id: 5, method: 'tools/call', params: {
                name: 'get_repayment_documentation_template',
                arguments: {
                  templateType: 'current_income_statement',
                  outputFormat: 'text',
                  borrowerName: 'Live Acceptance Borrower',
                  incomeSources: [{ sourceType: 'employment', name: 'Example Employer', grossAmount: 1200, paymentFrequency: 'biweekly' }]
                }
              }
            });
            assert(typeof document.result?.structuredContent === 'string', 'documentation template did not return structured string content');
            assert(document.result.structuredContent.includes('Live Acceptance Borrower'), 'documentation template lost supplied borrower fact');
            assert(document.result.structuredContent.includes('Supporting evidence checklist'), 'documentation template missing evidence checklist');

            const notification = await mcp({ jsonrpc: '2.0', method: 'notifications/initialized' });
            assert(notification.status === 202, `notification expected 202, got ${notification.status}`);
            assert((await notification.text()) === '', 'notification response body must be empty');

            const wrongContentType = await fetchChecked(`${base}/mcp`, {
              method: 'POST', headers: { accept: 'application/json, text/event-stream', 'content-type': 'text/plain' }, body: '{}'
            });
            assert(wrongContentType.status === 415, `wrong Content-Type expected 415, got ${wrongContentType.status}`);

            const wrongAccept = await fetchChecked(`${base}/mcp`, {
              method: 'POST', headers: { accept: 'application/json', 'content-type': 'application/json' },
              body: JSON.stringify({ jsonrpc: '2.0', id: 6, method: 'ping' })
            });
            assert(wrongAccept.status === 406, `wrong Accept expected 406, got ${wrongAccept.status}`);

            const forbiddenOrigin = await mcp({ jsonrpc: '2.0', id: 7, method: 'ping' }, { origin: 'https://evil.example' });
            assert(forbiddenOrigin.status === 403, `untrusted Origin expected 403, got ${forbiddenOrigin.status}`);

            const oversized = await fetchChecked(`${base}/mcp`, {
              method: 'POST', headers: mcpHeaders, body: 'x'.repeat(70 * 1024)
            });
            assert(oversized.status === 413, `oversized request expected 413, got ${oversized.status}`);

            console.log(JSON.stringify({
              live_acceptance: 'passed',
              url: base,
              version: health.version,
              policy_snapshot: health.policy_snapshot,
              tools: toolNames,
              checks
            }));
            console.log(`::notice title=Live product acceptance::${checks} production checks passed`);
          })().catch((error) => {
            console.error(error);
            const message = error instanceof Error ? error.message : String(error);
            const safeMessage = message.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
            console.error(`::error title=Live acceptance failure::${safeMessage}`);
            process.exit(1);
          });
