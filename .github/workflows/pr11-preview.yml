name: PR11 Isolated Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: student-loan-idr-pr11-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.number == 11 && github.event.pull_request.head.repo.full_name == 'nothinginfinity/student-loan-idr-mcp' && github.event.pull_request.head.ref == 'feat/v0.9.11-mobile-income-explorer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Validate isolated preview config
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const cfg = JSON.parse(readFileSync('wrangler.preview.jsonc', 'utf8'));
          if (cfg.name !== 'student-loan-idr-pr11-preview' ||
              cfg.main !== 'src/index.ts' ||
              cfg.workers_dev !== true ||
              cfg.d1_databases?.length ||
              cfg.kv_namespaces?.length ||
              cfg.r2_buckets?.length ||
              cfg.vars?.MCP_BEARER_TOKEN) {
            throw new Error('Preview isolation validation failed');
          }
          console.log('Preview config isolated from production databases/storage.');
          NODE
      - run: npx wrangler deploy --config wrangler.preview.jsonc --dry-run --outdir=.wrangler-preview-dry-run
      - name: Deploy isolated preview Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.preview.jsonc | tee preview-deploy.log
          preview_url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' preview-deploy.log | tail -n 1 || true)"
          if [ -z "$preview_url" ]; then
            echo 'Could not extract a live preview URL from Wrangler output' >&2
            exit 1
          fi
          echo "Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"
          echo "PR source commit: ${{ github.event.pull_request.head.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "No production D1 or RESEND secrets bound." >> "$GITHUB_STEP_SUMMARY"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
      - name: Smoke-test real preview UI and calculator
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.PREVIEW_URL;
          let html = "";
          let uiStatus = 0;
          let ready = false;
          for (let attempt = 1; attempt <= 12; attempt++) {
            try {
              const ui = await fetch(base, { cache: "no-store" });
              uiStatus = ui.status;
              html = await ui.text();
              ready = ui.ok && html.includes('id="explorer-range"') && html.includes('id="calculator-form"');
              if (ready) break;
              console.log("Preview UI not yet ready:", attempt, "status:", uiStatus, "html bytes:", html.length, "explorer:", html.includes('id="explorer-range"'));
            } catch (error) {
              console.log("Preview propagation attempt:", attempt, String(error));
            }
            await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          if (!ready) throw new Error("Preview UI did not become ready; status=" + uiStatus + ", html bytes=" + html.length + ", explorer=" + html.includes('id="explorer-range"'));
          const response = await fetch(base + '/api/calculate', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              income: [{ cadence: 'annual', amount: 50000 }],
              region: 'contiguous_us',
              familySize: 2,
              dependentsClaimedOnFederalTaxReturn: 1,
              plans: ['RAP']
            })
          });
          const body = await response.json();
          if (!response.ok || body?.result?.planEstimates?.[0]?.monthlyPaymentEstimate !== 116.67) throw new Error('Preview calculator fixture failed');
          console.log('Preview smoke test passed:', base);
          NODE
